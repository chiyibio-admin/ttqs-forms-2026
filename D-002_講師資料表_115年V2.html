<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D-002_講師資料表_115年V2</title>
<style>
:root {
  --bg:#f5f7fa; --card:#ffffff; --sec-bg:#ffffff;
  --accent:#1a56db; --text:#1a1a2e; --muted:#64748b;
  --border:#e2e8f0; --white:#ffffff; --req:#dc2626;
  --shadow: 0 1px 4px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;
  background:var(--bg);color:var(--text);padding:28px 16px;min-height:100vh}
.wrap{max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* 表頭 */
.hdr{background:var(--accent);border-radius:14px;
  padding:36px 32px 28px;text-align:center;
  box-shadow:0 4px 16px rgba(26,86,219,.25)}
.hdr h1{font-size:1.7rem;font-weight:600;color:#fff;margin-bottom:0}

/* 卡片 */
.card{background:var(--card);border-radius:12px;padding:22px 24px;
  box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:.97rem;font-weight:700;color:var(--accent);
  margin-bottom:16px;padding-bottom:10px;
  border-bottom:2px solid var(--accent);
  display:flex;align-items:center;gap:6px}

/* 格線 */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.full{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:5px}
label{font-size:.9rem;color:var(--muted);font-weight:500}
label .r{color:var(--req);margin-left:2px}

/* 輸入框 */
input[type=text],input[type=date],select,textarea{
  background:#fff;border:1.5px solid var(--border);border-radius:8px;
  padding:10px 13px;font-size:1rem;color:var(--text);width:100%;
  font-family:inherit;transition:border-color .15s, box-shadow .15s;}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(26,86,219,.1)}
textarea{min-height:96px;resize:vertical;line-height:1.6}

/* 量表（新格式） */
.scale-wrap{background:#f8faff;border-radius:10px;padding:14px 16px}
.scale-labels{display:flex;justify-content:space-between;
  font-size:.85rem;color:var(--muted);margin-bottom:10px}
.scale-btns{display:flex;gap:8px}

/* 量表（舊格式相容） */
.scale-row{background:#f8faff;border-radius:10px;padding:14px 16px;
  display:flex;align-items:center;gap:8px}
.scale-lbl{font-size:.85rem;color:var(--muted);flex:0 0 auto;white-space:nowrap}
.scale-mid{display:flex;gap:8px;flex:1}

.sc{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.sc span{font-size:.9rem;color:var(--muted);font-weight:600}
.sc input{width:18px;height:18px;cursor:pointer;accent-color:var(--accent)}

/* 選項 */
.choices{display:flex;flex-direction:column;gap:8px}
.ci{display:flex;align-items:center;gap:10px;font-size:1rem;
  padding:9px 12px;border-radius:8px;cursor:pointer;
  border:1.5px solid var(--border);transition:all .15s;}
.ci:hover{border-color:var(--accent);background:#f8faff}
.ci input{width:16px;height:16px;cursor:pointer;accent-color:var(--accent);flex-shrink:0}

/* 說明框 */
.info-bar,.info{background:#f0f7ff;border:1px solid #bfdbfe;border-radius:10px;
  padding:11px 18px;text-align:center;font-size:.93rem;color:#1e40af}

/* 送出 */
.sub-wrap{text-align:center;padding:4px 0}
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;
  padding:14px 56px;font-size:1.1rem;font-weight:600;cursor:pointer;
  font-family:inherit;transition:all .18s;letter-spacing:.3px;
  box-shadow:0 4px 12px rgba(26,86,219,.3)}
.btn:hover{background:#1441b8;box-shadow:0 6px 16px rgba(26,86,219,.4);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}

/* 完成畫面 */
#ok{display:none;background:#fff;border:1.5px solid #10b981;border-radius:14px;
  padding:40px;text-align:center}
#ok .ok-icon{font-size:3rem;margin-bottom:12px}
#ok h2{font-size:1.5rem;color:#065f46;margin-bottom:8px}
#ok p{font-size:1rem;color:#64748b}

/* 請款資料：檔案上傳／提示 */
input[type=file]{background:#fff;border:1.5px dashed var(--border);border-radius:8px;
  padding:12px;font-size:.95rem;width:100%;font-family:inherit;cursor:pointer}
input[type=file]:hover{border-color:var(--accent);background:#f8faff}
.hint{font-size:.8rem;color:var(--muted);line-height:1.5}
.hint.err{color:var(--req);font-weight:600}
.privacy{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px 14px;
  font-size:.82rem;color:#92400e;line-height:1.6;margin-bottom:14px}
#filePreview{max-width:220px;max-height:160px;border-radius:6px;border:1px solid var(--border);display:none;margin-top:4px}

/* 頁尾 */
.footer{text-align:center;font-size:.84rem;color:#94a3b8;padding:8px 0 16px;line-height:1.8}

@media(max-width:580px){
  .grid{grid-template-columns:1fr}
  .hdr{padding:28px 20px 22px}
  .card{padding:18px}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- 表頭 -->
  <div class="hdr">
    <h1>講師資料表</h1>
  </div>

  <!-- 評分說明（僅含量表的表單顯示） -->
  

  <!-- 表單主體 -->
  <form id="mainForm" onsubmit="submitForm(event)">
    <div class="card"><div class="card-title">📋 基本資訊</div><div class="grid"><div class="f"><label for="_____0">填寫日期<span class="r">*</span></label><input type="date" id="_____0" name="_____0" required></div><div class="f"><label for="_____1">講師姓名<span class="r">*</span></label><input type="text" id="_____1" name="_____1" placeholder="請輸入" required></div><div class="f"><label for="________2">現職機構/公司<span class="r">*</span></label><input type="text" id="________2" name="________2" placeholder="請輸入" required></div><div class="f"><label for="___3">職稱<span class="r">*</span></label><input type="text" id="___3" name="___3" placeholder="請輸入" required></div></div></div><div class="card"><div class="card-title">📝 填寫內容</div><div class="grid"><div class="f"><label for="_____0">聯絡電話<span class="r">*</span></label><input type="text" id="_____0" name="_____0" placeholder="請輸入" required></div><div class="f"><label for="_____1">電子郵件<span class="r">*</span></label><input type="text" id="_____1" name="_____1" placeholder="請輸入" required></div></div></div><div class="card"><div class="grid"><div class="f full"><label for="_____0">最高學歷<span class="r">*</span></label><div class="choices"><label class="ci"><input type="radio" name="_____0" value="高中職" required>高中職</label><label class="ci"><input type="radio" name="_____0" value="大學/技術學院" required>大學/技術學院</label><label class="ci"><input type="radio" name="_____0" value="碩士" required>碩士</label><label class="ci"><input type="radio" name="_____0" value="博士" required>博士</label></div></div></div></div><div class="card"><div class="card-title">🎓 專業資歷</div><div class="grid"><div class="f full"><label for="_______0">主要專業領域<span class="r">*</span></label><textarea id="_______0" name="_______0" placeholder="請輸入..." required></textarea></div></div></div><div class="card"><div class="card-title">📝 填寫內容</div><div class="grid"><div class="f"><label for="_________0">相關教學經驗年數<span class="r">*</span></label><input type="text" id="_________0" name="_________0" placeholder="請輸入" required></div></div></div><div class="card"><div class="grid"><div class="f full"><label for="__________3___0">曾授課課程名稱（至少3項）<span class="r">*</span></label><textarea id="__________3___0" name="__________3___0" placeholder="請輸入..." required></textarea></div></div></div><div class="card"><div class="card-title">🎓 專業資歷</div><div class="grid"><div class="f full"><label for="________0">相關証照與資格</label><textarea id="________0" name="________0" placeholder="請輸入..." ></textarea></div></div></div>
<div class="card"><div class="card-title">💰 請款資料（講師鐘點費撥付用）</div>
<div class="privacy">🔒 以下資料僅供本公司撥付講師鐘點費及辦理所得扣繳申報使用，依《個人資料保護法》妥善保管，不作其他用途。</div>
<div class="grid">
<div class="f"><label for="pay_id">身分證字號<span class="r">*</span></label><input type="text" id="pay_id" name="pay_id" placeholder="例：A123456789" maxlength="10" autocomplete="off" required><div class="hint" id="pay_id_hint">英文字母 1 碼＋數字 9 碼（居留證號亦可）</div></div>
<div class="f"><label for="pay_holder">戶名<span class="r">*</span></label><input type="text" id="pay_holder" name="pay_holder" placeholder="須與講師本人姓名相同" required></div>
<div class="f"><label for="pay_bank">銀行名稱及代碼<span class="r">*</span></label><input type="text" id="pay_bank" name="pay_bank" placeholder="例：台灣銀行 004" required></div>
<div class="f"><label for="pay_branch">分行名稱<span class="r">*</span></label><input type="text" id="pay_branch" name="pay_branch" placeholder="例：台中分行" required></div>
<div class="f full"><label for="pay_acct">匯款帳號<span class="r">*</span></label><input type="text" id="pay_acct" name="pay_acct" placeholder="僅填數字，不含 - 或空白" inputmode="numeric" autocomplete="off" required><div class="hint">請依存摺封面完整填寫（含開頭的 0）</div></div>
<div class="f full"><label for="pay_file">存摺封面影本<span class="r">*</span></label><input type="file" id="pay_file" name="pay_file" accept="image/*,application/pdf" required><div class="hint" id="pay_file_hint">可拍照或上傳圖片／PDF，需清楚看到戶名、銀行、帳號；檔案 8MB 以內</div><img id="filePreview" alt="存摺封面預覽"></div>
<div class="f full"><label>個資使用同意<span class="r">*</span></label><div class="choices"><label class="ci"><input type="checkbox" name="pay_agree" value="本人同意" required>本人同意上述資料供講師費撥付及扣繳申報使用</label></div></div>
</div></div>
    <div class="sub-wrap">
      <button type="submit" class="btn">送出表單</button>
    </div>
  </form>

  <!-- 成功訊息 -->
  <div id="ok">
    <h2>✅ 填寫完成！</h2>
    <p>感謝您的填寫，回覆已成功送出。</p>
    <p style="margin-top:8px;font-size:.85rem;color:#047857">奇異生技股份有限公司 訓練部門</p>
  </div>

  <!-- 頁尾 -->

  <div class="footer">
    講師資料表<br>
    奇異生技股份有限公司 · 115年度訓練品質管理<br>
    D-002 · D設計 · 指標10、11
  </div>

</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxVJsHr-QgDlU53xABVoYrklRgUN8wXjJfXE1LGbH1BtVvjbZFvAywr9vsUQJi_Runx/exec';
const FORM_CODE = 'D-002';
const FIELD_IDS = ["_____0","_____1","________2","___3","_____4","_____5","_____6","_______7","_________8","__________3___9","________10"];

async function submitForm(e) {
  e.preventDefault();
  const form = document.getElementById('mainForm');
  const btn  = form.querySelector('.btn');
  btn.textContent = '送出中...';
  btn.disabled    = true;

  // 收集資料（欄位標籤 → 值）
  const data = {
    formCode:   FORM_CODE,
    submitTime: new Date().toLocaleString('zh-TW')
  };

  form.querySelectorAll('.f').forEach(function(field) {
    const labelEl = field.querySelector('label');
    if (!labelEl) return;
    // 取標籤文字，去除必填星號與多餘空白
    const labelText = labelEl.textContent.replace(/[\*＊]/g, '').trim();
    if (!labelText) return;

    const radios    = field.querySelectorAll('input[type="radio"]');
    const checkboxes= field.querySelectorAll('input[type="checkbox"]');
    const selects   = field.querySelectorAll('select');
    const texts     = field.querySelectorAll('input[type="text"], input[type="date"], textarea');

    if (radios.length) {
      const checked = field.querySelector('input[type="radio"]:checked');
      data[labelText] = checked ? checked.value : '';
    } else if (checkboxes.length) {
      const vals = Array.from(field.querySelectorAll('input[type="checkbox"]:checked')).map(c => c.value);
      data[labelText] = vals.join('、');
    } else if (selects.length) {
      data[labelText] = selects[0].value;
    } else if (texts.length) {
      data[labelText] = texts[0].value;
    }
  });

  // ── 請款資料：驗證＋存摺影本 ──
  const idVal = (document.getElementById('pay_id').value || '').trim().toUpperCase();
  const acctVal = (document.getElementById('pay_acct').value || '').replace(/[\s-]/g, '');
  if (!/^[A-Z][A-Z0-9]\d{8}$/.test(idVal)) {
    alert('身分證字號格式不正確，請確認（英文字母1碼＋數字9碼）');
    btn.textContent = '送出表單'; btn.disabled = false;
    document.getElementById('pay_id').focus(); return;
  }
  if (!/^\d{6,16}$/.test(acctVal)) {
    alert('匯款帳號請只填數字（6～16碼）');
    btn.textContent = '送出表單'; btn.disabled = false;
    document.getElementById('pay_acct').focus(); return;
  }
  data['身分證字號'] = idVal;
  data['匯款帳號'] = acctVal;
  const fileEl = document.getElementById('pay_file');
  const file = fileEl.files && fileEl.files[0];
  if (!file) {
    alert('請上傳存摺封面影本');
    btn.textContent = '送出表單'; btn.disabled = false; return;
  }
  try {
    btn.textContent = '上傳檔案中...';
    const f = await prepareFile(file);
    const safeName = (data['講師姓名'] || '講師') + '_存摺封面_' + new Date().toISOString().slice(0,10) + f.ext;
    data['存摺封面影本'] = '（上傳中）' + safeName;
    data._files = [{ field: '存摺封面影本', name: safeName, mimeType: f.mimeType, base64: f.base64 }];
  } catch (err) {
    alert(err.message || '檔案讀取失敗，請換一張圖片再試');
    btn.textContent = '送出表單'; btn.disabled = false; return;
  }

  // 送出到 GAS Web App
  if (GAS_URL) {
    try {
      btn.textContent = '送出中...';
      await fetch(GAS_URL, {
        method:  'POST',
        mode:    'no-cors',   // GAS 跨域需使用 no-cors
        headers: { 'Content-Type': 'text/plain' },
        body:    JSON.stringify(data)
      });
    } catch (err) {
      console.error('送出失敗:', err);
    }
  }

  // no-cors 無法讀取回應，直接顯示成功畫面
  setTimeout(function() {
    form.style.display = 'none';
    document.getElementById('ok').style.display = 'block';
  }, 800);
}
// ── 存摺影本：圖片自動壓縮、PDF 直接上傳 ──
function prepareFile(file) {
  return new Promise(function(resolve, reject) {
    if (file.size > 8 * 1024 * 1024) return reject(new Error('檔案超過 8MB，請壓縮或改用較小的圖片'));
    const reader = new FileReader();
    reader.onerror = function(){ reject(new Error('檔案讀取失敗')); };
    if (file.type === 'application/pdf') {
      reader.onload = function(){ resolve({ mimeType:'application/pdf', ext:'.pdf', base64: String(reader.result).split(',')[1] }); };
      reader.readAsDataURL(file); return;
    }
    if (!/^image\//.test(file.type)) return reject(new Error('請上傳圖片或 PDF 檔'));
    reader.onload = function(){
      const img = new Image();
      img.onload = function(){
        const max = 1800, scale = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve({ mimeType:'image/jpeg', ext:'.jpg', base64: c.toDataURL('image/jpeg', 0.85).split(',')[1] });
      };
      img.onerror = function(){ reject(new Error('圖片格式無法讀取，請改用 JPG／PNG')); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
document.addEventListener('DOMContentLoaded', function(){
  const fe = document.getElementById('pay_file'), pv = document.getElementById('filePreview');
  if (fe) fe.addEventListener('change', function(){
    const f = fe.files[0];
    if (f && /^image\//.test(f.type)) { pv.src = URL.createObjectURL(f); pv.style.display = 'block'; }
    else { pv.style.display = 'none'; }
  });
  const idEl = document.getElementById('pay_id');
  if (idEl) idEl.addEventListener('input', function(){ idEl.value = idEl.value.toUpperCase(); });
});
</script>
</body>
</html>
