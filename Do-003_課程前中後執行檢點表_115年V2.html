<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Do-003_課程前中後執行檢點表_115年V2</title>
<style>
:root {
  --bg:#f5f7fa; --card:#ffffff; --sec-bg:#ffffff;
  --accent:#1a56db; --text:#1a1a2e; --muted:#64748b;
  --border:#e2e8f0; --white:#ffffff; --req:#dc2626;
  --shadow: 0 1px 4px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;
  background:var(--bg);color:var(--text);padding:28px 16px;min-height:100vh}
.wrap{max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* 表頭 */
.hdr{background:var(--accent);border-radius:14px;
  padding:36px 32px 28px;text-align:center;
  box-shadow:0 4px 16px rgba(26,86,219,.25)}
.hdr h1{font-size:1.7rem;font-weight:600;color:#fff;margin-bottom:0}

/* 卡片 */
.card{background:var(--card);border-radius:12px;padding:22px 24px;
  box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:.97rem;font-weight:700;color:var(--accent);
  margin-bottom:16px;padding-bottom:10px;
  border-bottom:2px solid var(--accent);
  display:flex;align-items:center;gap:6px}

/* 格線 */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.full{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:5px}
label{font-size:.9rem;color:var(--muted);font-weight:500}
label .r{color:var(--req);margin-left:2px}

/* 輸入框 */
input[type=text],input[type=date],select,textarea{
  background:#fff;border:1.5px solid var(--border);border-radius:8px;
  padding:10px 13px;font-size:1rem;color:var(--text);width:100%;
  font-family:inherit;transition:border-color .15s, box-shadow .15s;}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(26,86,219,.1)}
textarea{min-height:96px;resize:vertical;line-height:1.6}

/* 量表（新格式） */
.scale-wrap{background:#f8faff;border-radius:10px;padding:14px 16px}
.scale-labels{display:flex;justify-content:space-between;
  font-size:.85rem;color:var(--muted);margin-bottom:10px}
.scale-btns{display:flex;gap:8px}

/* 量表（舊格式相容） */
.scale-row{background:#f8faff;border-radius:10px;padding:14px 16px;
  display:flex;align-items:center;gap:8px}
.scale-lbl{font-size:.85rem;color:var(--muted);flex:0 0 auto;white-space:nowrap}
.scale-mid{display:flex;gap:8px;flex:1}

.sc{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.sc span{font-size:.9rem;color:var(--muted);font-weight:600}
.sc input{width:18px;height:18px;cursor:pointer;accent-color:var(--accent)}

/* 選項 */
.choices{display:flex;flex-direction:column;gap:8px}
.ci{display:flex;align-items:center;gap:10px;font-size:1rem;
  padding:9px 12px;border-radius:8px;cursor:pointer;
  border:1.5px solid var(--border);transition:all .15s;}
.ci:hover{border-color:var(--accent);background:#f8faff}
.ci input{width:16px;height:16px;cursor:pointer;accent-color:var(--accent);flex-shrink:0}

/* 說明框 */
.info-bar,.info{background:#f0f7ff;border:1px solid #bfdbfe;border-radius:10px;
  padding:11px 18px;text-align:center;font-size:.93rem;color:#1e40af}

/* 送出 */
.sub-wrap{text-align:center;padding:4px 0}
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;
  padding:14px 56px;font-size:1.1rem;font-weight:600;cursor:pointer;
  font-family:inherit;transition:all .18s;letter-spacing:.3px;
  box-shadow:0 4px 12px rgba(26,86,219,.3)}
.btn:hover{background:#1441b8;box-shadow:0 6px 16px rgba(26,86,219,.4);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}

/* 完成畫面 */
#ok{display:none;background:#fff;border:1.5px solid #10b981;border-radius:14px;
  padding:40px;text-align:center}
#ok .ok-icon{font-size:3rem;margin-bottom:12px}
#ok h2{font-size:1.5rem;color:#065f46;margin-bottom:8px}
#ok p{font-size:1rem;color:#64748b}

/* 頁尾 */
.footer{text-align:center;font-size:.84rem;color:#94a3b8;padding:8px 0 16px;line-height:1.8}

@media(max-width:580px){
  .grid{grid-template-columns:1fr}
  .hdr{padding:28px 20px 22px}
  .card{padding:18px}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- 表頭 -->
  <div class="hdr">
    <h1>課程前中後執行檢點表</h1>
  </div>

  <!-- 評分說明（僅含量表的表單顯示） -->
  

  <!-- 表單主體 -->
  <form id="mainForm" onsubmit="submitForm(event)">
    <div class="card"><div class="card-title">📋 基本資料</div><div class="grid"><div class="f full"><label for="f_course">課程名稱</label><input type="text" id="f_course" name="f_course" placeholder="請輸入"></div><div class="f"><label for="f_date">課程日期</label><input type="date" id="f_date" name="f_date"></div><div class="f"><label for="f_owner">負責人</label><input type="text" id="f_owner" name="f_owner" placeholder="請輸入"></div></div></div><div class="card"><div class="card-title">① 課前準備</div><div class="grid"><div class="f full"><label id="q1">【課前】設備測試完成</label><div class="choices" role="radiogroup" aria-labelledby="q1"><label class="ci"><input type="radio" name="scale_01" value="完成">完成</label><label class="ci"><input type="radio" name="scale_01" value="未完成">未完成</label><label class="ci"><input type="radio" name="scale_01" value="不適用">不適用</label></div></div><div class="f full"><label id="q2">【課前】教材講義準備</label><div class="choices" role="radiogroup" aria-labelledby="q2"><label class="ci"><input type="radio" name="scale_02" value="完成">完成</label><label class="ci"><input type="radio" name="scale_02" value="未完成">未完成</label><label class="ci"><input type="radio" name="scale_02" value="不適用">不適用</label></div></div><div class="f full"><label id="q3">【課前】學員出席確認</label><div class="choices" role="radiogroup" aria-labelledby="q3"><label class="ci"><input type="radio" name="scale_03" value="完成">完成</label><label class="ci"><input type="radio" name="scale_03" value="未完成">未完成</label><label class="ci"><input type="radio" name="scale_03" value="不適用">不適用</label></div></div><div class="f full"><label id="q4">【課前】講師確認聯絡</label><div class="choices" role="radiogroup" aria-labelledby="q4"><label class="ci"><input type="radio" name="scale_04" value="完成">完成</label><label class="ci"><input type="radio" name="scale_04" value="未完成">未完成</label><label class="ci"><input type="radio" name="scale_04" value="不適用">不適用</label></div></div></div></div><div class="card"><div class="card-title">② 課中執行</div><div class="grid"><div class="f full"><label id="q5">【課中】簽到表完成</label><div class="choices" role="radiogroup" aria-labelledby="q5"><label class="ci"><input type="radio" name="scale_05" value="完成">完成</label><label class="ci"><input type="radio" name="scale_05" value="未完成">未完成</label><label class="ci"><input type="radio" name="scale_05" value="不適用">不適用</label></div></div><div class="f full"><label id="q6">【課中】課程按大綱執行情況</label><div class="choices" role="radiogroup" aria-labelledby="q6"><label class="ci"><input type="radio" name="scale_06" value="完全按照大綱執行">完全按照大綱執行</label><label class="ci"><input type="radio" name="scale_06" value="小幅調整">小幅調整</label><label class="ci"><input type="radio" name="scale_06" value="大幅調整">大幅調整</label></div></div><div class="f full"><label for="f_incident">【課中】突發狀況記錄</label><textarea id="f_incident" name="f_incident" placeholder="無突發狀況可留白；如有，請記錄發生時間、狀況與處理方式"></textarea></div></div></div><div class="card"><div class="card-title">③ 課後收尾</div><div class="grid"><div class="f full"><label id="q7">【課後】滿意度問卷發放完成</label><div class="choices" role="radiogroup" aria-labelledby="q7"><label class="ci"><input type="radio" name="scale_07" value="完成">完成</label><label class="ci"><input type="radio" name="scale_07" value="未完成">未完成</label><label class="ci"><input type="radio" name="scale_07" value="不適用">不適用</label></div></div><div class="f full"><label id="q8">【課後】場地復原確認完成</label><div class="choices" role="radiogroup" aria-labelledby="q8"><label class="ci"><input type="radio" name="scale_08" value="完成">完成</label><label class="ci"><input type="radio" name="scale_08" value="未完成">未完成</label><label class="ci"><input type="radio" name="scale_08" value="不適用">不適用</label></div></div></div></div><div class="card"><div class="card-title">📝 總結</div><div class="grid"><div class="f full"><label for="f_summary">整體執行說明</label><textarea id="f_summary" name="f_summary" placeholder="如有「未完成」或「大幅調整」的項目，請在此說明原因與後續處理方式"></textarea></div></div></div><div class="info">所有欄位皆為選填；單選題再點一次已選的選項即可取消。</div>
    <div class="sub-wrap">
      <button type="submit" class="btn">送出表單</button>
    </div>
  </form>

  <!-- 成功訊息 -->
  <div id="ok">
    <h2>✅ 填寫完成！</h2>
    <p>感謝您的填寫，回覆已成功送出。</p>
    <p style="margin-top:8px;font-size:.85rem;color:#047857">奇異生技股份有限公司 訓練部門</p>
  </div>

  <!-- 頁尾 -->

  <div class="footer">
    課程前中後執行檢點表<br>
    奇異生技股份有限公司 · 115年度訓練品質管理<br>
    Do-003 · Do執行 · 指標12、13、14
  </div>

</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxVJsHr-QgDlU53xABVoYrklRgUN8wXjJfXE1LGbH1BtVvjbZFvAywr9vsUQJi_Runx/exec';
const FORM_CODE = 'Do-003';

async function submitForm(e) {
  e.preventDefault();
  const form = document.getElementById('mainForm');
  const btn  = form.querySelector('.btn');
  btn.textContent = '送出中...';
  btn.disabled    = true;

  // 收集資料（欄位標籤 → 值）
  const data = {
    formCode:   FORM_CODE,
    submitTime: new Date().toLocaleString('zh-TW')
  };

  form.querySelectorAll('.f').forEach(function(field) {
    const labelEl = field.querySelector('label');
    if (!labelEl) return;
    // 取標籤文字，去除必填星號與多餘空白
    const labelText = labelEl.textContent.replace(/[\*＊]/g, '').trim();
    if (!labelText) return;

    const radios    = field.querySelectorAll('input[type="radio"]');
    const checkboxes= field.querySelectorAll('input[type="checkbox"]');
    const selects   = field.querySelectorAll('select');
    const texts     = field.querySelectorAll('input[type="text"], input[type="date"], textarea');

    if (radios.length) {
      const checked = field.querySelector('input[type="radio"]:checked');
      data[labelText] = checked ? checked.value : '';
    } else if (checkboxes.length) {
      const vals = Array.from(field.querySelectorAll('input[type="checkbox"]:checked')).map(c => c.value);
      data[labelText] = vals.join('、');
    } else if (selects.length) {
      data[labelText] = selects[0].value;
    } else if (texts.length) {
      data[labelText] = texts[0].value;
    }
  });

  // 送出到 GAS Web App
  if (GAS_URL) {
    try {
      fetch(GAS_URL, {
        method:  'POST',
        mode:    'no-cors',   // GAS 跨域需使用 no-cors
        headers: { 'Content-Type': 'text/plain' },
        body:    JSON.stringify(data)
      });
    } catch (err) {
      console.error('送出失敗:', err);
    }
  }

  // no-cors 無法讀取回應，直接顯示成功畫面
  setTimeout(function() {
    form.style.display = 'none';
    document.getElementById('ok').style.display = 'block';
  }, 800);
}
</script>
<script>
// 單選題：再點一次已選取的選項可取消（欄位皆為選填）
document.querySelectorAll('#mainForm input[type="radio"]').forEach(function(r){
  r.addEventListener('click', function(){
    if (this.dataset.was === '1') { this.checked = false; this.dataset.was = '0'; }
    else {
      document.querySelectorAll('#mainForm input[name="' + this.name + '"]').forEach(function(x){ x.dataset.was = '0'; });
      this.dataset.was = '1';
    }
  });
});
</script>
</body>
</html>
